[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/=node_modules/@openzeppelin/contracts/", "@openzeppelin-contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
